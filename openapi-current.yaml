        breakdown:
          $ref: '#/components/schemas/MatchScoreBreakdown'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MatchResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        donation:
          $ref: '#/components/schemas/DonationSummaryResponse'
        requirement:
          $ref: '#/components/schemas/RequirementSummaryResponse'
        score:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/MatchStatus'
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        reviewedBy:
          $ref: '#/components/schemas/UserSummaryResponse'
