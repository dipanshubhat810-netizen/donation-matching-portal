services:
  - type: web
    name: donation-matching-portal
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_URL
        fromDatabase:
          name: donation-matching-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: donation-matching-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: donation-matching-db
          property: password
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: donation-matching-db
    plan: free
    postgresMajorVersion: "18"
