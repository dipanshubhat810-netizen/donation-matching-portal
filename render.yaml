services:
  - type: web
    name: donation-matching-portal
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        fromDatabase:
          name: donation-matching-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: donation-matching-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: donation-matching-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

databases:
  - name: donation-matching-db
    plan: free
    postgresMajorVersion: "18"
