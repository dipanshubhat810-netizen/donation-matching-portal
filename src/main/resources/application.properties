spring.application.name=donation-matching-portal
server.port=${PORT:${SERVER_PORT:8080}}

# PostgreSQL connection. The JDBC URL is composed from discrete parts so that
# platforms like Render can inject DB_HOST/DB_PORT/DB_NAME via fromDatabase
# (property: host/port/database) without needing a postgres:// to jdbc: URL
# conversion. DB_URL (full JDBC URL) wins when present; the parts fall back to
# local-development defaults matching a Homebrew PostgreSQL install. Override in
# any non-local environment; never commit real credentials.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:donation_matching_portal}}
spring.datasource.username=${DB_USERNAME:dipanshubhat}
spring.datasource.password=${DB_PASSWORD:}

# Development-friendly schema generation. No domain entities exist yet (Phase 2).
# PRODUCTION MUST switch to explicit migrations (Flyway/Liquibase) and use
# spring.jpa.hibernate.ddl-auto=validate/none. Do not rely on ddl-auto=update
# outside local development.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Omit null-valued fields from JSON responses so error payloads do not carry a
# null `fields` entry on non-validation errors.
spring.jackson.default-property-inclusion=non_null

# Pagination. Spring Data clamps a requested page size to this maximum instead
# of erroring, so a client cannot request unbounded result sets.
spring.data.web.pageable.max-page-size=100

# JWT configuration. JWT_SECRET is REQUIRED to start the application (a blank
# value is rejected at startup). Generate a strong random secret of at least
# 32 bytes, e.g. `openssl rand -base64 48`, and export it in the environment.
# Never commit a real secret. JWT_EXPIRATION_MS sets the access-token lifetime
# in milliseconds (default 1 hour).
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Admin seeding (demo/production convenience). When BOTH ADMIN_EMAIL and
# ADMIN_PASSWORD are set, the application creates an ADMIN account on startup
# if one does not already exist. Setting only one of the two fails fast so a
# misconfigured deployment does not silently run without an admin. The account
# name is always "Administrator". Never commit real admin credentials.
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}

# Restricted CORS. Comma-separated list of allowed origins for the /api/**
# routes, e.g. CORS_ALLOWED_ORIGINS=https://demo.example.com,http://localhost:5173.
# When empty (default), no CORS headers are sent, so browser-based cross-origin
# callers are not allowed. Never use a wildcard with credentials.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

logging.level.org.springframework.boot=INFO
