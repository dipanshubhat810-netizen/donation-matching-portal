spring.application.name=donation-matching-portal
server.port=${PORT:${SERVER_PORT:8080}}

# PostgreSQL connection. DB_URL, DB_USERNAME, DB_PASSWORD are read from the
# environment. The local defaults match a Homebrew PostgreSQL install with the
# default superuser (trust auth, no password). Override in any non-local
# environment; never commit real credentials.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/donation_matching_portal}
spring.datasource.username=${DB_USERNAME:dipanshubhat}
spring.datasource.password=${DB_PASSWORD:}

# Development-friendly schema generation. No domain entities exist yet (Phase 2).
# PRODUCTION MUST switch to explicit migrations (Flyway/Liquibase) and use
# spring.jpa.hibernate.ddl-auto=validate/none. Do not rely on ddl-auto=update
# outside local development.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Pagination. Spring Data clamps a requested page size to this maximum instead
# of erroring, so a client cannot request unbounded result sets.
spring.data.web.pageable.max-page-size=100

# JWT configuration. JWT_SECRET is REQUIRED to start the application (a blank
# value is rejected at startup). Generate a strong random secret of at least
# 32 bytes, e.g. `openssl rand -base64 48`, and export it in the environment.
# Never commit a real secret. JWT_EXPIRATION_MS sets the access-token lifetime
# in milliseconds (default 1 hour).
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

logging.level.org.springframework.boot=INFO
