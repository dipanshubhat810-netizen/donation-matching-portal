spring.application.name=donation-matching-portal
server.port=${SERVER_PORT:8080}

# Tests use the same local PostgreSQL instance as development. The schema is
# created/updated by ddl-auto=update from the main properties.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/donation_matching_portal}
spring.datasource.username=${DB_USERNAME:dipanshubhat}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.open-in-view=false

# Match the main application pagination cap so test behavior mirrors production.
spring.data.web.pageable.max-page-size=100

# Test-only JWT secret. Overrides the main jwt.secret so the security layer
# initializes without requiring a JWT_SECRET environment variable during the
# build. Never reuse this value outside tests.
jwt.secret=test-only-secret-do-not-use-outside-tests-0123456789abcdef
jwt.expiration-ms=3600000
